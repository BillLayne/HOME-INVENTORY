<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" >
    <meta name="theme-color" content="#003f87" >
    <title>Bill Layne Insurance - Home Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            colors: {
              primary: {
                50:  '#e6effa',
                100: '#cce0f5',
                200: '#99c1eb',
                300: '#66a2e1',
                400: '#3383d7',
                500: '#0076d3',
                600: '#003f87',
                700: '#003270',
                800: '#002659',
                900: '#001d42',
              },
              accent: {
                400: '#fbbf24',
                500: '#f59e0b',
              }
            }
          }
        }
      }
    </script>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-in-out;
      }
      .glass-nav {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      .safe-top {
        padding-top: env(safe-area-inset-top, 0);
      }
      button, a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        -webkit-user-select: none;
        user-select: none;
      }

      /* ===========================================================
         BLI UX OVERRIDES (added 2026-05-14)
         These rules patch the pre-built React bundle without
         requiring source access. If you regenerate the bundle in
         AI Studio, fold these into the React source and delete.
         =========================================================== */

      /* Pillar 1: Take Photo / Upload File are the primary actions
         in an empty room. Give them real tap targets (≥56px) and
         readable type (16px). */
      label > div.bg-primary-600,
      label > div.bg-white.border-slate-300 {
        min-height: 56px !important;
        padding-top: 1rem !important;
        padding-bottom: 1rem !important;
        padding-left: 1.25rem !important;
        padding-right: 1.25rem !important;
        font-size: 1rem !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        border-radius: 0.75rem !important;
      }

      /* Pillar 1: Empty-state dropzone shouldn't be a 139px tile.
         When the photo grid has only one child (the upload tile),
         let it expand to full width. Falls back gracefully on
         older Safari that doesn't support :has(). */
      @supports selector(:has(*)) {
        .grid.grid-cols-2:has(> div:only-child) {
          grid-template-columns: 1fr !important;
        }
        .grid.grid-cols-2:has(> div:only-child) > div.aspect-square {
          aspect-ratio: auto !important;
          min-height: 200px !important;
          padding: 1.5rem !important;
        }
        .grid.grid-cols-2:has(> div:only-child) .flex.flex-col.items-center.gap-2 {
          width: 100% !important;
          max-width: 320px !important;
          gap: 0.75rem !important;
        }
      }

      /* Pillar 1: "Back to All Rooms" and the room-delete trash
         icon were 33-37px tall. Bump to 44px minimum. */
      button.text-sm.font-semibold,
      button[aria-label],
      button.p-2 {
        min-height: 44px !important;
        min-width: 44px !important;
      }

      /* Pillar 7: Disabled "Create List with AI" had ~1.5:1 contrast.
         Show it as a dashed outlined CTA so it reads as "not yet
         available" rather than decorative. The bundle uses the
         Tailwind variant `disabled:bg-slate-300`, so we target the
         disabled state directly. */
      button[disabled],
      button:disabled {
        background-color: #f1f5f9 !important;
        background-image: none !important;
        color: #64748b !important;
        border: 2px dashed #cbd5e1 !important;
        opacity: 1 !important;
        box-shadow: none !important;
        transform: none !important;
      }

      /* Pillar 8: Inactive stepper label was text-slate-400 (#94a3b8)
         on white = 2.4:1, fails WCAG AA. Bump to slate-500 (4.6:1).
         Scoped to the small caption directly below a stepper circle. */
      .rounded-full + p,
      [class*="rounded-full"][class*="bg-slate-100"] ~ p {
        color: #475569 !important; /* slate-600, ~6:1 on white */
      }

      /* Pillar 3: Trust line styling. Forced 100% width / flex-basis
         so it never gets crammed into a side-by-side row when its
         parent happens to be flex. */
      .bli-trust-line {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8125rem;
        line-height: 1.4;
        color: #475569;
        margin-top: 0.75rem;
        padding: 0.5rem 0.75rem;
        background: #f1f5f9;
        border-radius: 0.5rem;
        width: 100%;
        flex: 0 0 100%;
        box-sizing: border-box;
      }
      .bli-trust-line svg {
        flex-shrink: 0;
        width: 1rem;
        height: 1rem;
        color: #0076d3;
      }

      /* Polish: hero h1 was 24px on mobile, bump to 30px so it
         doesn't feel cramped on a marketing screen. */
      @media (max-width: 640px) {
        h1.text-4xl, h1.text-3xl, h2.text-4xl, h2.text-3xl {
          font-size: 1.875rem !important;
          line-height: 2.25rem !important;
        }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "uuid": "https://aistudiocdn.com/uuid@^13.0.0"
      }
    }
    </script>
    <script type="module" crossorigin src="./assets/index-C-0SvZLz.js"></script>

    <!-- BLI shim: defensive HEIC support + privacy trust lines.
         Runs after React mounts; non-destructive — only adds. -->
    <script>
      (function () {
        var LOCK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

        // HEIC: belt-and-suspenders. The current bundle already sets
        // accept="image/*,.heic,.heif,..." but if a future bundle is
        // less explicit, force the broad accept here so iPhone photos
        // (which iOS 11+ default to HEIC) always work.
        function patchFileInputs(root) {
          var inputs = root.querySelectorAll ? root.querySelectorAll('input[type="file"]') : [];
          inputs.forEach(function (inp) {
            var current = inp.getAttribute('accept') || '';
            if (!/heic|heif/i.test(current)) {
              inp.setAttribute('accept', 'image/*,.heic,.heif,image/heic,image/heif');
            }
            // Only force rear camera on inputs that aren't multi-select
            if (!inp.multiple && !inp.getAttribute('capture')) {
              inp.setAttribute('capture', 'environment');
            }
          });
        }

        // Inject a privacy/trust line into the room capture screen and
        // the customer details screen. Idempotent — uses a marker class.
        function injectTrustLines(root) {
          // Capture screen: place trust line below the dropzone card
          var dropzones = root.querySelectorAll
            ? root.querySelectorAll('.aspect-square.border-dashed')
            : [];
          dropzones.forEach(function (dz) {
            var card = dz.closest('.bg-white.rounded-xl, .bg-white[class*="rounded"]');
            if (!card || card.querySelector('.bli-trust-line[data-where="capture"]')) return;
            var line = document.createElement('p');
            line.className = 'bli-trust-line';
            line.setAttribute('data-where', 'capture');
            line.innerHTML = LOCK_SVG + '<span>Your photos stay on your device. We use AI only to identify items — we never store, share, or sell your inventory.</span>';
            card.appendChild(line);
          });

          // Customer details screen: place trust line below the form,
          // appended to the card (after the button) so it doesn't get
          // sucked into the button's flex row.
          var startBtns = [].slice.call(root.querySelectorAll ? root.querySelectorAll('button') : [])
            .filter(function (b) { return /Start Inventory/i.test(b.textContent || ''); });
          startBtns.forEach(function (btn) {
            var card = btn.closest('.bg-white');
            if (!card || card.querySelector('.bli-trust-line[data-where="details"]')) return;
            var line = document.createElement('p');
            line.className = 'bli-trust-line';
            line.setAttribute('data-where', 'details');
            line.innerHTML = LOCK_SVG + '<span>Saved on your device. We never sell your information.</span>';
            card.appendChild(line);
          });
        }

        function run() {
          patchFileInputs(document);
          injectTrustLines(document);
        }

        // Initial pass once React paints
        var ready = false;
        function start() {
          if (ready) return;
          ready = true;
          run();
          var mo = new MutationObserver(function () { run(); });
          mo.observe(document.body, { childList: true, subtree: true });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', start);
        } else {
          // Wait one tick so React has a chance to mount #root
          setTimeout(start, 50);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>
  </body>
</html>
