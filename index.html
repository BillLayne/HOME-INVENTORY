<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#003f87" />
    <title>Bill Layne Insurance - Home Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            colors: {
              // Bill Layne Insurance brand palette — navy primary, gold accent.
              // Tailwind CDN JIT means this single config recolors every
              // bg-primary-* / text-primary-* class throughout the React bundle.
              primary: {
                50:  '#e6effa',
                100: '#cce0f5',
                200: '#99c1eb',
                300: '#66a2e1',
                400: '#3383d7',
                500: '#0076d3', // BLI Cerulean
                600: '#003f87', // BLI Navy (primary)
                700: '#003270',
                800: '#002659',
                900: '#001d42',
              },
              accent: {
                400: '#fbbf24', // Warm gold (kept from prior config)
                500: '#f59e0b',
              }
            }
          }
        }
      }
    </script>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-in-out;
      }
      .glass-nav {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
      .safe-top    { padding-top: env(safe-area-inset-top, 0); }

      /* ===== Room tile polish =====
         The bundle's unselected room tile is `bg-white border-slate-100`
         (white on barely-visible gray, gray icon). That reads as a
         placeholder, not a tappable choice. Add a subtle navy gradient
         + visible border + navy icon so unselected tiles look like
         real cards. Selected state is unchanged. */
      button.bg-white.border-slate-100[class*="aspect-square"] {
        background: linear-gradient(140deg, #ffffff 0%, #f0f6fd 60%, #e6effa 100%) !important;
        border-color: #b8d0ec !important;
        box-shadow:
          0 4px 14px -4px rgba(0, 63, 135, 0.12),
          0 1px 2px rgba(0, 63, 135, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.8) !important;
      }
      button.bg-white.border-slate-100[class*="aspect-square"] svg {
        color: #0076d3 !important;
      }
      button.bg-white.border-slate-100[class*="aspect-square"]:hover,
      button.bg-white.border-slate-100[class*="aspect-square"]:focus-visible {
        background: linear-gradient(140deg, #ffffff 0%, #cce0f5 100%) !important;
        border-color: #3383d7 !important;
        box-shadow:
          0 10px 20px -6px rgba(0, 63, 135, 0.22),
          0 2px 4px rgba(0, 63, 135, 0.08) !important;
      }

      /* Custom Room "+" tile uses a dashed border — give it more
         visual weight too. */
      button[class*="border-dashed"][class*="aspect-square"] {
        background: #f8fafc !important;
        border-color: #fbbf24 !important;
        border-width: 2px !important;
      }
      button[class*="border-dashed"][class*="aspect-square"] svg {
        color: #f59e0b !important;
      }

      /* Trust line injected by the script below. Forced full-width
         so it never gets sucked into a parent flex row next to a CTA. */
      .bli-trust-line {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8125rem;
        line-height: 1.4;
        color: #475569;
        margin-top: 0.75rem;
        padding: 0.625rem 0.75rem;
        background: #f1f5f9;
        border-radius: 0.5rem;
        width: 100%;
        flex: 0 0 100%;
        box-sizing: border-box;
      }
      .bli-trust-line svg {
        flex-shrink: 0;
        width: 1rem;
        height: 1rem;
        color: #0076d3;
      }
    </style>

  <script type="module" crossorigin src="/HOME-INVENTORY/assets/index-CA0zizbw.js"></script>

  <!-- BLI trust line: privacy reassurance on the customer-details
       screen and the photo capture screen. Idempotent, non-destructive. -->
  <script>
    (function () {
      var LOCK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

      // Card matcher — the bundle uses bg-white OR a gradient like
      // "bg-gradient-to-br from-white to-primary-50/...". Match both
      // via the rounded-{xl,2xl,3xl} + shadow combo that all cards
      // share, AND the card must contain a non-trivial number of
      // children (a button or input alone often has shadow+rounded
      // too). Skips the starting element.
      function findCard(start) {
        var el = start.parentElement;
        while (el && el !== document.body) {
          var cls = el.className || '';
          if (typeof cls === 'string'
              && /rounded-(xl|2xl|3xl)/.test(cls)
              && /shadow/.test(cls)
              && el.children.length >= 2) {
            return el;
          }
          el = el.parentElement;
        }
        return null;
      }

      function injectTrustLines(root) {
        // Capture screen: anchor on the file input itself.
        var fileInputs = root.querySelectorAll
          ? root.querySelectorAll('input[type="file"]')
          : [];
        fileInputs.forEach(function (inp) {
          var card = findCard(inp);
          if (!card) return;
          if (card.querySelector('.bli-trust-line[data-where="capture"]')) return;
          var line = document.createElement('p');
          line.className = 'bli-trust-line';
          line.setAttribute('data-where', 'capture');
          line.innerHTML = LOCK_SVG + '<span>Your photos stay on your device. We use AI only to identify items — we never store, share, or sell your inventory.</span>';
          card.appendChild(line);
        });

        // Customer details screen: anchor on the "Start Inventory" button.
        var startBtns = [].slice.call(root.querySelectorAll ? root.querySelectorAll('button') : [])
          .filter(function (b) { return /Start Inventory|Next|Continue/i.test(b.textContent || ''); });
        startBtns.forEach(function (btn) {
          var card = findCard(btn);
          if (!card) return;
          if (card.querySelector('.bli-trust-line[data-where="details"]')) return;
          // Sanity check: card must contain a text input (the name field)
          if (!card.querySelector('input[type="text"], input:not([type])')) return;
          var line = document.createElement('p');
          line.className = 'bli-trust-line';
          line.setAttribute('data-where', 'details');
          line.innerHTML = LOCK_SVG + '<span>Saved on your device. We never sell your information.</span>';
          card.appendChild(line);
        });
      }

      // Scroll-to-top on screen transitions. The React app swaps screens
      // in place (no URL change), so the browser keeps the previous
      // scroll position — landing the user mid-page on the next screen.
      // This delegated click handler fires window.scrollTo(0) shortly
      // after any button that is known to advance / change screens.
      // Normalize apostrophes (curly U+2019, U+02BC, etc.) to straight
      // before regex matching, so "Let's" vs "Let’s" both hit.
      function normalize(s) {
        return s.replace(/[‘’ʼ❛❜]/g, "'").trim();
      }
      var SCREEN_CHANGE_RE = new RegExp(
        '^(' +
          "Let's Start Inventory|Lets Start Inventory|" +
          'Living Room|Kitchen|Master Bedroom|Bathroom|Office|Dining Room|' +
          'Garage|Den|Basement|Attic|Custom Room|Add a Custom Room|Add Room|' +
          'Back to Rooms|Back to All Rooms|Back to Inventory|' +
          'Generate Final Report|Go Back & Add Items|Go Back and Add Items|' +
          'View Report|See Report|Continue|Next' +
        ')$', 'i');

      function bindScrollToTop() {
        if (bindScrollToTop._bound) return;
        bindScrollToTop._bound = true;
        document.addEventListener('click', function (e) {
          var btn = e.target.closest('button, a');
          if (!btn) return;
          var text = normalize(btn.innerText || btn.textContent || '');
          if (!text) return;
          if (SCREEN_CHANGE_RE.test(text)) {
            // Let React finish its render, then scroll.
            setTimeout(function () {
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 60);
          }
        }, true);
      }

      function start() {
        injectTrustLines(document);
        bindScrollToTop();
        var mo = new MutationObserver(function () { injectTrustLines(document); });
        mo.observe(document.body, { childList: true, subtree: true });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { setTimeout(start, 50); });
      } else {
        setTimeout(start, 50);
      }
    })();
  </script>
</head>
  <body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>
  </body>
</html>
